<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sun Path Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Sun Path Simulator</h1>
    <p class="subtitle">
      Drag the sliders to see how the sun's position in the sky changes with
      date, time of day, and latitude.
    </p>

    <div class="layout">
      <canvas id="sky" width="420" height="420" aria-label="Sky diagram showing the sun's position"></canvas>

      <div class="controls">
        <div class="control">
          <label for="date-slider">Date: <span id="date-label"></span></label>
          <input type="range" id="date-slider" min="0" max="364" value="171" />
        </div>

        <div class="control">
          <label for="time-slider">Time: <span id="time-label"></span></label>
          <input type="range" id="time-slider" min="0" max="1439" step="5" value="720" />
        </div>

        <div class="control">
          <label for="lat-slider">Latitude: <span id="lat-label"></span></label>
          <input type="range" id="lat-slider" min="-90" max="90" step="1" value="52" />
        </div>

        <dl class="readout">
          <dt>Altitude</dt>
          <dd id="altitude-value"></dd>
          <dt>Azimuth</dt>
          <dd id="azimuth-value"></dd>
          <dt>Declination</dt>
          <dd id="declination-value"></dd>
        </dl>

        <p class="note">
          Longitude is fixed at 0° (Greenwich); all times are UTC.
          The orange arc traces the sun's path for the selected day.
        </p>
      </div>
    </div>
  </main>

  <script src="src/solarPosition.js"></script>
  <script src="app.js"></script>
</body>
</html>
